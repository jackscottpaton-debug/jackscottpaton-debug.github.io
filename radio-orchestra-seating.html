<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Radio Orchestra</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--pale:#b8b8b8;--line:#111}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:Arial,Helvetica,sans-serif}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);min-height:34px}
.topbar button{appearance:none;background:#fff;color:#111;border:0;border-right:1px solid var(--line);border-radius:0;padding:8px 11px;font:12px/1 Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.topbar button:hover,.topbar button.active{background:#111;color:#fff}
.topbar button:disabled{color:#bbb;background:#fff;cursor:default}
.statusbar{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 10px;font-size:11px;line-height:1.2;text-transform:uppercase}
.orchestra{position:relative;max-width:1320px;margin:0 auto;padding:28px 16px 80px;min-height:720px}
.row{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:8px;margin:0 auto 24px}
.row::before{content:attr(data-label);width:100%;padding-bottom:1px;text-align:center;font-size:9px;line-height:1;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row.back{max-width:1050px}
.row.brass,.row.winds{max-width:940px}
.row.world{max-width:1220px}
.row.strings{max-width:1180px}
.row.voice{max-width:760px;margin-top:38px}
.seat{position:relative;appearance:none;width:116px;min-height:72px;background:#fff;color:#111;border:1px solid #111;border-radius:0;padding:8px;text-align:left;cursor:pointer;transition:none}
.seat:hover{background:#f5f5f5}
.seat.muted{background:#111;color:#fff}
.seat.unavailable{color:#aaa;border-color:#aaa}
.seat.unavailable:hover{background:#fff}
.instrument{font-size:14px;line-height:1.02;letter-spacing:-.25px;text-transform:uppercase}
.seatstate{position:absolute;left:8px;bottom:7px;font-size:8px;line-height:1;text-transform:uppercase;letter-spacing:.04em;color:#777}
.seat.muted .seatstate{color:#ccc}
.seat.unavailable .seatstate{color:#aaa}
.tooltip{position:fixed;z-index:60;display:none;pointer-events:none;width:270px;background:#fff;color:#111;border:1px solid #111;padding:9px 10px;font-size:11px;line-height:1.35}
.tooltip.show{display:block}
.tipinstrument{font-size:14px;text-transform:uppercase;margin-bottom:4px}
.tipstation{margin-bottom:5px}
.tipmeta{font-size:10px;color:#777;text-transform:uppercase}
.conductor{width:165px;margin:58px auto 0;border-top:1px solid #111;text-align:center;padding-top:7px;font-size:10px;text-transform:uppercase;color:#777}
.footer{border-top:1px solid #111;padding:8px 10px 36px;font-size:10px;color:#777;text-transform:uppercase}
@media(max-width:850px){
  .orchestra{padding-left:10px;padding-right:10px;min-height:0}
  .row{gap:9px;margin-bottom:22px;max-width:100%!important}
  .seat{width:132px;min-height:74px}
  .instrument{font-size:15px}
}
@media(max-width:520px){
  .orchestra{padding-top:22px}
  .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:20px}
  .row::before{grid-column:1/-1}
  .seat{width:100%;min-height:70px}
  .row.voice{margin-top:24px}
}
</style>
</head>
<body>
<div class="topbar">
  <button id="start" disabled>START ALL</button>
  <button id="muteAll" disabled>MUTE ALL</button>
  <button id="stop" disabled>STOP</button>
  <button id="autoMix" class="active">AUTO MIX: ON</button>
</div>
<div class="statusbar">
  <span id="status">Resolving orchestra…</span>
  <span><span id="readyCount">0 READY · 6 RELAY · 17 OPEN</span> · <span id="audibleCount">0 AUDIBLE</span></span>
</div>

<main class="orchestra" id="orchestra">
  <div class="row back" data-row="back" data-label="Keyboards / percussion"></div>
  <div class="row brass" data-row="brass" data-label="Brass / reeds"></div>
  <div class="row winds" data-row="winds" data-label="Winds / breath"></div>
  <div class="row world" data-row="world" data-label="World instruments"></div>
  <div class="row strings" data-row="strings" data-label="Strings"></div>
  <div class="row voice" data-row="voice" data-label="Unfixed / electronic / voice"></div>
  <div class="conductor">YOU / CONDUCTOR</div>
</main>
<div class="footer">RADIO ORCHESTRA · 50 CHAIRS</div>
<div class="tooltip" id="tooltip" aria-hidden="true"></div>

  {id:"erhu",row:"world",instrument:"ERHU",station:"Open chair",open:true,purity:"instrument-specific source required",detail:"no honest current specialist stream verified"},

  {id:"guitar",row:"strings",instrument:"GUITAR",station:"Radio Art — Solo Guitar",direct:["https://live.radioart.com/fSolo_guitar.mp3"],purity:"solo / fingerstyle",detail:"Radio Art · HTTPS"},
  {id:"violin",row:"strings",instrument:"VIOLIN",station:"Epic Classical — Violin",direct:["https://stream.epic-classical.com/classical-violin"],purity:"violin classical",detail:"Epic Classical · HTTPS"},
  {id:"viola",row:"strings",instrument:"VIOLA CAIPIRA",station:"Viola Caipira Radio",direct:["https://centova.euroti.com.br:20055/stream"],purity:"viola-caipira-focused",detail:"Brazilian specialist stream · HTTPS"},
  {id:"cello",row:"strings",instrument:"CELLO",station:"Radio Art — Cello Works",direct:["https://live.radioart.com/fCello_works.mp3"],purity:"cello-focused works",detail:"Radio Art · HTTPS"},
  {id:"doublebass",row:"strings",instrument:"DOUBLE BASS",station:"Open chair",open:true,purity:"instrument-specific source required",detail:"unrelated pop station false positive rejected"},
  {id:"lute",row:"strings",instrument:"LUTE",station:"Radio Art — Lute",direct:["https://live.radioart.com/fLute.mp3"],purity:"lute-focused",detail:"Radio Art · HTTPS"},
  {id:"ukulele",row:"strings",instrument:"UKULELE",station:"Aloha Joe — Ukulele Island",relay:["http://s3.voscast.com:8662/stream"],purity:"ukulele and island programming",detail:"verified source is HTTP · HTTPS relay needed"},
  {id:"mandolin",row:"strings",instrument:"MANDOLIN",station:"Open chair",open:true,purity:"instrument-specific source required",detail:"no honest current specialist stream verified"},
  {id:"banjo",row:"strings",instrument:"BANJO",station:"Jazz Banjo Radio",direct:["https://streaming.live365.com/a57039"],purity:"banjo-led jazz",detail:"Live365 · HTTPS"},

  {id:"soloist",row:"voice",instrument:"UNKNOWN SOLOIST",station:"Radio Art — Solo Classical Instruments",direct:["https://live.radioart.com/fSolo_instruments.mp3"],purity:"solo instrument changes track-to-track",detail:"Radio Art · HTTPS"},
  {id:"voice",row:"voice",instrument:"A CAPPELLA",station:"Radio Art — A Cappella",direct:["https://live.radioart.com/fA_Cappella.mp3"],purity:"unaccompanied voices / choir",detail:"Radio Art · HTTPS"},
  {id:"theremin",row:"voice",instrument:"THEREMIN",station:"Open chair",open:true,purity:"instrument-specific source required",detail:"no honest current specialist stream verified"},
  {id:"chiptune",row:"voice",instrument:"CHIPTUNE",station:"Zelerk — Chiptune",direct:["https://radio.zelerk.com/listen/chiptune/stream.mp3"],purity:"synthesized chiptune",detail:"Zelerk · HTTPS"},
  {id:"spoken",row:"voice",instrument:"SPOKEN WORD",station:"The Indie Beat — Spoken",direct:["https://azura.theindiebeat.fm/listen/the_indie_beat_radio_-_spoken/radio.mp3"],purity:"spoken-word programming",detail:"The Indie Beat · HTTPS"}
];

const $=id=>document.getElementById(id);
const app={started:false,autoMix:true,ctx:null,master:null,limiter:null,mixTimer:null};

function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

function build(){
  for(const s of specs){
    const row=document.querySelector(`[data-row="${s.row}"]`);
    const b=document.createElement("button");
    b.className="seat unavailable";
    b.id=`seat-${s.id}`;
    b.type="button";
    b.setAttribute("aria-disabled","true");
    b.innerHTML=`<div class="instrument">${esc(s.instrument)}</div><div class="seatstate" id="state-${s.id}">RESOLVING</div>`;
    row.appendChild(b);
    const a=new Audio();
    a.preload="none";
    a.volume=1;
    a.muted=false;
    a.playsInline=true;
    s.audio=a;s.ready=false;s.playing=false;s.muted=false;s.urls=[];s.candidateIndex=0;s.mixMode="PENDING";
    a.addEventListener("playing",()=>{s.playing=true;setSeatState(s,s.muted?"MUTED":"LIVE");updateCounts()});
    a.addEventListener("waiting",()=>{if(s.playing)setSeatState(s,"BUFFERING")});
    a.addEventListener("stalled",()=>{if(s.playing)setSeatState(s,"BUFFERING")});
    a.addEventListener("error",()=>handleAudioError(s));
    b.addEventListener("click",()=>toggleSeat(s));
    b.addEventListener("mouseenter",e=>showTip(s,e));
    b.addEventListener("mousemove",e=>moveTip(e));
    b.addEventListener("mouseleave",hideTip);
  }
}

function setSeatState(s,t){$("state-"+s.id).textContent=t}

function setReady(s,urls,label){
  const clean=[...new Set((urls||[]).filter(Boolean))];
  if(!clean.length){setSeatState(s,"NO STREAM");return}
  s.urls=clean;s.ready=true;s.candidateIndex=0;s.audio.src=clean[0];
  const b=$("seat-"+s.id);b.setAttribute("aria-disabled","false");b.classList.remove("unavailable");
  if(label)s.resolvedDetail=label;
  setSeatState(s,"READY");updateCounts();
}

function streamScore(x,q){
  const n=(x.name||"").toLowerCase(),qq=q.toLowerCase();let score=0;
  if(n===qq)score+=120;
  if(n.includes(qq)||qq.includes(n))score+=50;
  if((x.url_resolved||x.url||"").startsWith("https://"))score+=30;
  if(Number(x.lastcheckok)===1)score+=20;
  if(Number(x.hls)!==1)score+=5;
  return score;
}

async function resolveSearch(s){
  let found=[];
  for(const base of API){
    for(const q of s.search){
      try{
        const r=await fetch(base+"/json/stations/search?name="+encodeURIComponent(q)+"&hidebroken=true&limit=30");
        if(!r.ok)continue;
        const data=await r.json();
        found.push(...data.map(x=>({x,q})));
      }catch(e){}
    }
    if(found.length)break;
  }
  if(!found.length){setSeatState(s,"NOT FOUND");updateCounts();return}
  found.sort((a,b)=>streamScore(b.x,b.q)-streamScore(a.x,a.q));
  const viable=found.map(o=>o.x).filter(x=>Number(x.lastcheckok)===1);
  const urls=[];
  viable.forEach(x=>{const u=x.url_resolved||x.url;if(u&&u.startsWith("https://"))urls.push(u)});
  viable.forEach(x=>{const u=x.url_resolved||x.url;if(u&&!urls.includes(u))urls.push(u)});
  const best=viable[0]||found[0].x;
  setReady(s,urls,`${best.bitrate||"?"} kbps ${(best.codec||"").toUpperCase()} · ${best.country||s.detail}`);
}

async function supportsCorsAudio(url){
  if(!url||!url.startsWith("https://"))return false;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),4500);
  try{
    const r=await fetch(url,{method:"GET",mode:"cors",cache:"no-store",signal:controller.signal});
    const ok=r.ok;
    if(r.body)r.body.cancel().catch(()=>{});
    controller.abort();
    return ok;
  }catch(e){return false}finally{clearTimeout(timer)}
}

function ensureMixer(){
  if(app.ctx)return app.ctx;
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return null;
  const ctx=new AudioCtx();
  const master=ctx.createGain();
  const limiter=ctx.createDynamicsCompressor();
  limiter.threshold.value=-6;limiter.knee.value=3;limiter.ratio.value=16;limiter.attack.value=.003;limiter.release.value=.25;
  master.connect(limiter);limiter.connect(ctx.destination);
  app.ctx=ctx;app.master=master;app.limiter=limiter;
  return ctx;
}

function prepareMixer(s,url){
  if(s.graph||s.mixMode==="RAW")return;
  if(!app.autoMix||!s.corsOK){s.mixMode="RAW";return}
  const ctx=ensureMixer();
  if(!ctx){s.mixMode="RAW";return}
  try{
    s.audio.crossOrigin="anonymous";s.audio.src=url;s.audio.load();
    const source=ctx.createMediaElementSource(s.audio);
    const analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.72;
    const gain=ctx.createGain();gain.gain.value=1;
    const compressor=ctx.createDynamicsCompressor();
    compressor.threshold.value=-18;compressor.knee.value=18;compressor.ratio.value=4;compressor.attack.value=.012;compressor.release.value=.3;
    source.connect(analyser);analyser.connect(gain);gain.connect(compressor);compressor.connect(app.master);
    s.graph={source,analyser,gain,compressor,data:new Float32Array(analyser.fftSize)};s.mixMode="AUTO";s.mixGain=1;
  }catch(e){
    s.mixMode="RAW";s.audio.removeAttribute("crossorigin");s.audio.src=url;s.audio.load();
  }
}

function runAutoMix(){
  const mixed=specs.filter(s=>s.graph&&s.playing&&!s.muted);
  const now=app.ctx?app.ctx.currentTime:0;
  for(const s of specs.filter(s=>s.graph)){
    let desired=1;
    if(app.autoMix&&s.playing&&!s.muted){
      s.graph.analyser.getFloatTimeDomainData(s.graph.data);
      let sum=0;for(const v of s.graph.data)sum+=v*v;
      const rms=Math.sqrt(sum/s.graph.data.length);
      if(rms>.004)desired=Math.max(.3,Math.min(3,.12/rms));
    }
    s.mixGain=(s.mixGain||1)*.82+desired*.18;
    s.graph.gain.gain.setTargetAtTime(s.mixGain,now,.12);
  }
  if(app.master){
    const safe=Math.min(1,1.4/Math.sqrt(Math.max(1,mixed.length)));
    app.master.gain.setTargetAtTime(safe,now,.18);
  }
}

function startMixLoop(){
  if(app.mixTimer)return;
  app.mixTimer=setInterval(runAutoMix,250);
}

async function resolveAll(){
  build();
  await Promise.allSettled(specs.map(async s=>{
    if(s.open){setSeatState(s,"OPEN CHAIR");return}
    if(s.relay){setSeatState(s,"RELAY NEEDED");return}
    return s.direct?setReady(s,s.direct,s.detail):resolveSearch(s);
  }));
  const ready=specs.filter(s=>s.ready).length;
  $("status").textContent="Checking AUTO MIX compatibility…";
  await Promise.allSettled(specs.filter(s=>s.ready).map(async s=>{s.corsOK=await supportsCorsAudio(s.urls[0]);s.mixMode=s.corsOK?"AUTO":"RAW"}));
  const levelled=specs.filter(s=>s.corsOK).length;
  $("status").textContent=`${ready} performers ready across ${specs.length} chairs · ${levelled} AUTO MIX compatible.`;
  $("start").disabled=ready===0;$("muteAll").disabled=ready===0;updateCounts();
}

async function tryPlay(s){
  setSeatState(s,"CONNECTING");
  for(let i=s.candidateIndex;i<s.urls.length;i++){
    s.candidateIndex=i;prepareMixer(s,s.urls[i]);s.audio.src=s.urls[i];s.audio.volume=s.graph?1:(app.autoMix?.72:1);s.audio.muted=s.muted;
    try{await s.audio.play();s.playing=true;setSeatState(s,s.muted?"MUTED":"LIVE");return true}catch(e){}
  }
  s.playing=false;setSeatState(s,"STREAM ERROR");return false;
}

async function startAll(){
  app.started=true;$("start").classList.add("active");$("stop").disabled=false;$("status").textContent="Starting orchestra…";
  if(app.ctx&&app.ctx.state==="suspended")await app.ctx.resume();
  await Promise.allSettled(specs.filter(s=>s.ready).map(s=>tryPlay(s)));
  startMixLoop();runAutoMix();
  const live=specs.filter(s=>s.playing).length;$("status").textContent=`${live} performers broadcasting · AUTO MIX ${app.autoMix?"ON":"OFF"}.`;updateCounts();
}

function toggleSeat(s){
  if(!s.ready)return;
  s.muted=!s.muted;s.audio.muted=s.muted;
  const b=$("seat-"+s.id);b.classList.toggle("muted",s.muted);
  if(s.playing)setSeatState(s,s.muted?"MUTED":"LIVE");else setSeatState(s,s.muted?"MUTED · READY":"READY");
  updateCounts();
}

function muteAll(){
  const ready=specs.filter(s=>s.ready);const shouldMute=!ready.every(s=>s.muted);
  for(const s of ready){s.muted=shouldMute;s.audio.muted=shouldMute;$("seat-"+s.id).classList.toggle("muted",shouldMute);if(s.playing)setSeatState(s,shouldMute?"MUTED":"LIVE")}
  $("muteAll").textContent=shouldMute?"UNMUTE ALL":"MUTE ALL";updateCounts();
}

function stopAll(){
  for(const s of specs){if(!s.audio)continue;s.audio.pause();s.playing=false;if(s.ready)setSeatState(s,s.muted?"MUTED · READY":"READY")}
  app.started=false;$("start").classList.remove("active");$("stop").disabled=true;$("status").textContent="Stopped.";updateCounts();
}

function handleAudioError(s){
  s.playing=false;
  if(!app.started){setSeatState(s,"STREAM ERROR");updateCounts();return}
  if(s.candidateIndex<s.urls.length-1){s.candidateIndex++;tryPlay(s)}else{setSeatState(s,"STREAM ERROR");updateCounts()}
}

function updateCounts(){
  const ready=specs.filter(s=>s.ready).length,relay=specs.filter(s=>s.relay).length,open=specs.filter(s=>s.open).length;
  const audible=specs.filter(s=>s.playing&&!s.muted).length;
  $("readyCount").textContent=`${ready} READY · ${relay} RELAY · ${open} OPEN`;$("audibleCount").textContent=`${audible} AUDIBLE`;
}

function showTip(s,e){
  const t=$("tooltip");
  const st=s.playing?(s.muted?"MUTED":"LIVE"):(s.ready?"READY":s.relay?"RELAY NEEDED":s.open?"OPEN CHAIR":"UNRESOLVED");
  const mix=s.ready?(s.mixMode==="AUTO"?"AUTO MIX COMPATIBLE":"RAW VOLUME · SOURCE BLOCKS ANALYSIS"):"NOT CONNECTED";
  t.innerHTML=`<div class="tipinstrument">${esc(s.instrument)}</div><div class="tipstation">${esc(s.station)}</div><div class="tipmeta">${esc(s.purity)}<br>${esc(s.resolvedDetail||s.detail)}<br>${esc(st)} · ${esc(mix)}</div>`;
  t.classList.add("show");t.setAttribute("aria-hidden","false");moveTip(e);
}
function moveTip(e){const t=$("tooltip"),pad=12;let x=e.clientX+14,y=e.clientY+14;const r=t.getBoundingClientRect();if(x+r.width>innerWidth-pad)x=e.clientX-r.width-14;if(y+r.height>innerHeight-pad)y=e.clientY-r.height-14;t.style.left=x+"px";t.style.top=y+"px"}
function hideTip(){const t=$("tooltip");t.classList.remove("show");t.setAttribute("aria-hidden","true")}

$("start").addEventListener("click",startAll);
$("muteAll").addEventListener("click",muteAll);
$("stop").addEventListener("click",stopAll);
$("autoMix").addEventListener("click",()=>{
  app.autoMix=!app.autoMix;$("autoMix").textContent=`AUTO MIX: ${app.autoMix?"ON":"OFF"}`;$("autoMix").classList.toggle("active",app.autoMix);
  for(const s of specs.filter(s=>s.ready&&!s.graph))s.audio.volume=app.autoMix?.72:1;
  runAutoMix();
  if(app.started)$("status").textContent=`AUTO MIX ${app.autoMix?"ON":"OFF"}.`;
});
resolveAll();
</script>
