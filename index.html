const C=document.getElementById('site-canvas');
function R(){
  C.innerHTML='';
  const k=Math.min(1,window.innerWidth/S.designWidth);
  C.style.width=S.designWidth+'px';
  C.style.height=S.pageHeight+'px';
  C.style.transform='scale('+k+')';
  C.style.transformOrigin='top left';
  C.parentElement.style.width=(S.designWidth*k)+'px';
  C.parentElement.style.height=(S.pageHeight*k)+'px';

  S.objects.slice().sort((a,b)=>(a.z||1)-(b.z||1)).forEach(o=>{
    const el=document.createElement('div');
    el.id=o.id;
    el.className='sobj sobj-'+o.type;
    el.style.left=o.x+'px';
    el.style.top=o.y+'px';
    el.style.width=o.width+'px';
    el.style.height=o.height+'px';
    el.style.zIndex=o.z||1;
    el.style.opacity=o.opacity??1;

    if(o.type==='text'){
      el.textContent=o.text||'';
      el.style.fontFamily=o.fontFamily;
      el.style.fontSize=(o.fontSize||12)+'px';
      el.style.color=o.color;
      el.style.background=o.background||'transparent';
      el.style.fontWeight=o.fontWeight||400;
      el.style.textAlign=o.align||'left';
      el.style.lineHeight=o.lineHeight||1.2;
    } else if(o.type==='image'){
      const im=document.createElement('img');
      im.src=o.src||'';
      im.alt='';
      im.style.objectFit=o.fit||'cover';
      im.style.border=(o.borderWidth||0)+'px solid '+(o.borderColor||'#444');
      if(o.link){
        const a=document.createElement('a');
        a.href=o.link;
        a.appendChild(im);
        el.appendChild(a);
      } else el.appendChild(im);
    } else if(o.type==='box'){
      el.style.border=(o.borderWidth||0)+'px solid '+(o.borderColor||'#444');
      el.style.background=o.background||'transparent';
    } else if(o.type==='nav'){
      el.style.fontFamily=o.fontFamily;
      el.style.fontSize=(o.fontSize||10)+'px';
      el.style.color=o.color;
      el.style.background=o.background||'#fff';
      const t=document.createElement('table'),tr=document.createElement('tr');

        const td=document.createElement('td');

        const a=document.createElement('a');
        a.href=c.scrollTarget?(c.scrollTarget==='__top__'?'#top':'#'+c.scrollTarget):(c.link||'#');

          a.addEventListener('click',ev=>{
            ev.preventDefault();
            if(c.scrollTarget==='__top__'){

            if(target){

        }

        tr.appendChild(td);
      });

      el.appendChild(t);
